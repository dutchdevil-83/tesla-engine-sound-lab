[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tesla-engine-sound-lab"
version = "0.1.0"
description = "Offline synthetic-telemetry engine sound bench prototype"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
audio = ["sounddevice>=0.5,<0.6"]

[project.scripts]
engine-sound-lab = "engine_sound_lab.cli:main"

[tool.setuptools.packages.find]
include = ["engine_sound_lab*"]
